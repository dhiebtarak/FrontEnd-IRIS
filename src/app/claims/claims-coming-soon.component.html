<main class="mx-auto max-w-[1500px] px-4 py-7 font-calibri md:px-7 lg:px-10 lg:py-10">
  <section class="relative overflow-hidden rounded-[30px] bg-iris-navy px-6 py-8 text-white shadow-[0_28px_70px_rgba(13,47,79,0.22)] md:px-9 md:py-10">
    <div class="absolute -right-20 -top-24 h-72 w-72 rounded-full border-[44px] border-iris-teal/20" aria-hidden="true"></div>
    <div class="absolute bottom-0 right-32 h-24 w-24 translate-y-1/2 rounded-full bg-iris-teal-light/15" aria-hidden="true"></div>
    <div class="relative max-w-3xl">
      <p class="text-[11px] font-bold uppercase tracking-[0.3em] text-iris-teal-extralight">Claims workspace</p>
      <h1 class="mt-3 font-cambria text-4xl font-bold leading-tight md:text-5xl">Claims</h1>
      <p class="mt-4 max-w-2xl text-sm leading-6 text-sky-100 md:text-base">Declare claims from a Bound contract overview. Follow collection notes and processing here.</p>
    </div>
  </section>
  <div class="mt-6">
    <app-contract-claims [contractId]="null" />
  </div>
</main>
