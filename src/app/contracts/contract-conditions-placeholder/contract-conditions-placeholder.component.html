<div class="min-h-screen bg-iris-bg font-calibri">
  <main class="mx-auto max-w-5xl px-4 py-10 md:px-8">
    <app-contract-creation-stepper [activeStep]="3" />

    <section class="mt-6 rounded-[28px] border border-iris-border/80 bg-white p-8 text-center shadow-[0_24px_60px_rgba(13,47,79,0.08)]">
      <p class="text-[11px] font-bold uppercase tracking-[0.24em] text-iris-teal">Step 03</p>
      <h1 class="mt-3 font-cambria text-3xl font-bold text-iris-navy">Conditions step is under development.</h1>
      <p class="mt-4 text-sm text-iris-slate">
        The information step saved the contract draft successfully.
        @if (contractId) {
          <span class="font-semibold text-iris-navy">Draft contract ID: {{ contractId }}.</span>
        }
      </p>
      <a
        [routerLink]="informationRoute"
        class="mt-6 inline-flex items-center justify-center rounded-xl bg-iris-teal px-5 py-3 text-sm font-semibold text-white transition hover:bg-iris-teal-light"
      >
        Back to Information
      </a>
    </section>
  </main>
</div>
